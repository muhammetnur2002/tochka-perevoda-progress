# Запуск на ВМ (Yandex Compute Cloud / любой VPS): docker compose up -d --build
# Переменные — в файле .env рядом с этим файлом (см. .env.example).
# HTTPS терминирует nginx/Caddy перед контейнером (см. docs/DEPLOY-YANDEX-CLOUD.md).
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: tochka-progress:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Плановые задачи: дедлайны/напоминания раз в час, очистка файлов раз в сутки
  cron:
    image: alpine:3.20
    restart: unless-stopped
    env_file: .env
    depends_on: [app]
    command: >
      sh -c 'apk add --no-cache curl >/dev/null &&
      echo "0 * * * * curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/deadlines" > /etc/crontabs/root &&
      echo "*/15 * * * * curl -fsS -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/notifications" >> /etc/crontabs/root &&
      echo "30 3 * * * curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/retention" >> /etc/crontabs/root &&
      crond -f -l 8'
