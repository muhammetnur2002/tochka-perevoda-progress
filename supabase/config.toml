# Конфигурация Supabase CLI для локального запуска (`supabase start`).
# Команды: supabase init уже выполнен; supabase start; supabase db push (или pnpm db:push).
project_id = "tochka-perevoda-progress"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/tg"]
jwt_expiry = 3600
enable_signup = true
# Для тестов: письма/OTP попадают в Inbucket на localhost:54324

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
